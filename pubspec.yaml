name: poddr
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^16.1.0
  provider: ^6.1.4
  audio_service: ^0.18.17
  audio_session: ^0.2.2
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.6
  shared_preferences: ^2.5.3
  http: ^1.3.0
  xml: ^6.5.0
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3 # dart run flutter_launcher_icons
  msix: ^3.16.8 # dart run msix:create
  drift_dev: ^2.26.0 # dart run build_runner build
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Thin.ttf
          weight: 100
        - asset: assets/fonts/Outfit-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900

msix_config:
  display_name: Poddr
  publisher_display_name: Marcus Sneitz
  identity_name: com.sn8z.poddr
  msix_version: 1.0.0.0
  logo_path: assets/images/icon.png
