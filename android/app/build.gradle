plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def keystorePath = keystoreProperties["storeFile"] ?: System.getenv("KEYSTORE_PATH")
def storePassword = keystoreProperties["storePassword"] ?: System.getenv("KEYSTORE_PASSWORD")
def keyAlias = keystoreProperties["keyAlias"] ?: System.getenv("KEY_ALIAS")
def keyPassword = keystoreProperties["keyPassword"] ?: System.getenv("KEY_PASSWORD")

android {
    namespace = "com.sn8z.poddr"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "29.0.14206865"
    // ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
		}

		kotlinOptions {
			jvmTarget = JavaVersion.VERSION_17.toString()
		}

    defaultConfig {
        applicationId = "com.sn8z.poddr"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePath && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword storePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }

//    lintOptions {
//        checkReleaseBuilds = false
//        abortOnError = false
//    }
}

flutter {
    source = "../.."
}
