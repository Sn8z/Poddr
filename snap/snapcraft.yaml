name: poddr
version: "3.0.0+1"
summary: A cross-platform podcast player
description: |
  Poddr is a modern podcast player.
  Browse podcast feeds, manage your subscriptions and enjoy seamless playback with media key support.
confinement: strict
grade: stable
license: GPL-3.0
icon: assets/images/logo.png
base: core24

parts:
  poddr:
    plugin: flutter
    source: .
    build-packages:
      - clang
      - cmake
    build-snaps:
      - flutter

apps:
  poddr:
    command: poddr
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - audio-playback
      - removable-media
      - desktop
      - desktop-legacy
      - gsettings
      - wayland
      - x11
      - opengl
      - home
    slots:
      mpris:
        interface: mpris
        name: poddr
