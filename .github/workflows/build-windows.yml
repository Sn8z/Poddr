name: Build Windows

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        default: 'main'
        required: true
        type: string
      flutter-version:
        description: 'Flutter version (empty = latest stable, e.g. 3.35.3 to reproduce)'
        default: ''
        required: false
        type: string

concurrency:
  group: build-windows-${{ github.event.inputs.branch || github.ref }}-${{ github.event.inputs.flutter-version || 'stable' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ github.event.inputs.flutter-version }}
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version
          dart pub global list

      - name: Install dependencies
        run: flutter pub get

      - name: Install fastforge
        run: dart pub global activate fastforge

      - name: Build EXE installer
        run: dart pub global run fastforge release --name windows

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: poddr-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
