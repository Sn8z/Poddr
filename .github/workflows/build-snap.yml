name: Build Snap

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        default: 'main'
        required: true
        type: string
      flutter-version:
        description: 'Flutter version (note: snap uses Flutter from core24, input is for consistency only)'
        default: ''
        required: false
        type: string

concurrency:
  group: build-snap-${{ github.event.inputs.branch || github.ref }}-${{ github.event.inputs.flutter-version || 'stable' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-snap:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Note Flutter version
        run: echo "Requested ${{ github.event.inputs.flutter-version || 'latest stable' }} – snap uses Flutter from core24, input ignored for now"

      - name: Build snap
        uses: canonical/action-build@v1
        id: snapcraft

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: poddr-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
          retention-days: 30
